<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dev Prompt Hub</title>
  <meta name="description" content="A prompt library and developer toolkit for AI-assisted software development.">
  <script>
    try { var s = JSON.parse(localStorage.getItem('dph:settings') || '{}'); document.documentElement.setAttribute('data-theme', s.theme === 'light' ? 'light' : 'dark'); } catch (e) {}
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%237b8cff%27/%3E%3Cpath d=%27M9 11l6 5-6 5M17 21h7%27 stroke=%27%230b0d1a%27 stroke-width=%272.6%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/prompts.css">
  <link rel="stylesheet" href="css/tools.css">
  <link rel="stylesheet" href="css/features.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="assets/icons/lucide.min.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
    <div class="scrim" id="scrim" data-act="close-sidebar"></div>
    <div class="main-col">
      <header class="topbar" id="topbar">
        <button type="button" class="btn btn-ghost btn-icon menu-btn" data-act="open-sidebar" aria-label="Open menu"><i data-lucide="menu" class="icon" aria-hidden="true"></i></button>
        <button type="button" class="search-trigger" data-act="open-search" aria-label="Search prompts (Ctrl+K)">
          <i data-lucide="search" class="icon" aria-hidden="true"></i><span class="st-text">Search prompts…</span><span class="kbd-group" aria-hidden="true"><kbd>Ctrl</kbd><kbd>K</kbd></span>
        </button>
        <div class="topbar-actions">
          <button type="button" class="btn btn-primary btn-sm" data-act="quick-add"><i data-lucide="plus" class="icon" aria-hidden="true"></i><span class="hide-sm">New prompt</span><span class="sr-only show-sm-only">New prompt</span></button>
          <button type="button" class="btn btn-ghost btn-icon" data-act="toggle-theme" aria-label="Toggle light and dark theme" title="Toggle theme (T)"><i data-lucide="sun-moon" class="icon" aria-hidden="true"></i></button>
          <button type="button" class="btn btn-ghost btn-icon notif-btn" data-act="notifications" aria-label="Notifications" title="Notifications"><i data-lucide="bell" class="icon" aria-hidden="true"></i><span class="notif-dot" id="notif-dot" hidden></span></button>
          <a class="btn btn-ghost btn-icon" href="#/settings" aria-label="Settings" title="Settings"><i data-lucide="user-round-cog" class="icon" aria-hidden="true"></i></a>
        </div>
      </header>
      <main id="view" tabindex="-1" aria-live="polite">
        <div class="skeleton-wrap" aria-hidden="true"><div class="skeleton sk-title"></div><div class="skeleton sk-row"></div><div class="skeleton sk-row"></div></div>
        <noscript><p class="noscript">Dev Prompt Hub needs JavaScript to run.</p></noscript>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="false"></div>

  <script src="js/utils/dom.js"></script>
  <script src="js/data/prompts.js"></script>
  <script src="js/utils/variables.js"></script>
  <script src="js/utils/quality.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/search.js"></script>
  <script src="js/utils/clipboard.js"></script>
  <script src="js/utils/export.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/prompt-card.js"></script>
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/viewer.js"></script>
  <script src="js/components/history.js"></script>
  <script src="js/components/prompt-editor.js"></script>
  <script src="js/components/palette.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/library.js"></script>
  <script src="js/pages/favorites.js"></script>
  <script src="js/pages/builder.js"></script>
  <script src="js/pages/developer-tools.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/projects.js"></script>
  <script src="js/pages/workflows.js"></script>
  <script src="js/pages/rules.js"></script>
  <script src="js/pages/quality.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
